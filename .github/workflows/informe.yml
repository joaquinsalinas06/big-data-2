name: Informe

on:
  push:
    paths:
      - "informe/**"
      - ".github/workflows/informe.yml"
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # latexmk repite las pasadas que hagan falta para el índice y las referencias
      - name: Compilar informe/main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: informe
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Advertencias de LaTeX
        if: always()
        run: grep -nE "LaTeX Warning|Package .* Warning|Overfull" informe/main.log || true

      - name: Subir PDF
        uses: actions/upload-artifact@v4
        with:
          name: informe
          path: informe/main.pdf
