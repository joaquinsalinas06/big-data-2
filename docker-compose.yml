name: music-dna

# Stack unificado de bases de datos para el Proyecto Grupal II:
# Iniciar todo: docker compose up -d
# Iniciar servicio individual: docker compose up -d mongodb (o cassandra / neo4j)

services:
  mongodb:
    image: mongo:7.0
    container_name: music-dna-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: listenbrainz_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: music-dna-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: music-dna
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 400M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 15s
      timeout: 10s
      retries: 20

  neo4j:
    image: neo4j:5.26.0
    container_name: music-dna-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cambia-esta-clave-local}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mongodb_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
