name: music-dna

# Stack unificado de bases de datos para el Proyecto Grupal II:
# Iniciar todo: docker compose up -d
# Iniciar servicio individual: docker compose up -d mongodb (o cassandra / neo4j)
# Airflow (orquestación): http://localhost:8080, usuario admin / admin

# Configuración compartida por los servicios de Airflow. Dentro de la red de Docker cada
# base se alcanza por su nombre de servicio, no por localhost.
x-airflow-common: &airflow-common
  build: ./airflow
  image: music-dna-airflow:2.10.5
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: music-dna-local
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow
    MONGO_URI: mongodb://mongodb:27017/
    MONGO_DATABASE: ${MONGO_DATABASE:-listenbrainz_db}
    MONGO_COLLECTION: ${MONGO_COLLECTION:-listens}
    CASSANDRA_HOSTS: cassandra
    CASSANDRA_PORT: "9042"
    CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-music_dna}
    CASSANDRA_DC: datacenter1
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cambia-esta-clave-local}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./databases:/opt/airflow/databases
    - ./scripts:/opt/airflow/scripts
    - ./data:/opt/airflow/data
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mongodb:
      condition: service_healthy
    cassandra:
      condition: service_healthy
    neo4j:
      condition: service_healthy

services:
  mongodb:
    image: mongo:7.0
    container_name: music-dna-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: listenbrainz_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:5.0
    container_name: music-dna-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: music-dna
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 400M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 15s
      timeout: 10s
      retries: 20

  neo4j:
    image: neo4j:5.26.0
    container_name: music-dna-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cambia-esta-clave-local}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Base de metadatos de Airflow (estado de DAGs, corridas y tareas).
  postgres:
    image: postgres:16
    container_name: music-dna-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Corre una sola vez: crea las carpetas compartidas, migra la base de metadatos
  # y crea el usuario admin/admin. Repetirlo no cambia nada.
  airflow-init:
    <<: *airflow-common
    container_name: music-dna-airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins /opt/airflow/data/airflow /opt/airflow/data/raw /opt/airflow/data/processed /opt/airflow/data/neo4j
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/plugins
        chown "${AIRFLOW_UID:-50000}:0" /opt/airflow/data /opt/airflow/data/airflow /opt/airflow/data/raw /opt/airflow/data/processed /opt/airflow/data/neo4j
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

  airflow-webserver:
    <<: *airflow-common
    container_name: music-dna-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: music-dna-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  mongodb_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
  postgres_data:
